<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | Miami Store</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./store-pages.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="./index.html">MIAMI STORE</a><nav><a href="./index.html">Tienda</a><a href="./admin.html">Administración</a></nav></div></header><main class="wrap section"><h1>Mi cuenta</h1><p id="status" role="status"></p><p id="session"></p><form id="authForm" class="panel-form"><h2>Acceder o registrarse</h2><label>Correo electrónico<input type="email" name="email" required autocomplete="email"></label><label>Contraseña<input type="password" name="password" minlength="8" required autocomplete="current-password"></label><label>Operación<select name="mode"><option value="login">Iniciar sesión</option><option value="register">Crear cuenta</option></select></label><button class="button dark" type="submit">Continuar</button></form><form id="profileForm" class="panel-form" hidden><h2>Mis datos para pedidos</h2><label>Nombres y apellidos<input id="fullName" required minlength="2" maxlength="120"></label><label>Celular<input id="phone" required minlength="6" maxlength="25"></label><label>Dirección de entrega<textarea id="address" minlength="5" required></textarea></label><button class="button dark" type="submit">Guardar datos</button></form><button id="logout" hidden>Salir de la cuenta</button></main><script src="./store-config.js?v=20261029-2"></script><script type="module" src="./account.js?v=20261029-2"></script></body></html>
