<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Miami Store</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./store-pages.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="./index.html">MIAMI STORE</a><nav><a href="./index.html">Tienda</a><a href="./cuenta.html">Mi cuenta</a></nav></div></header><main class="wrap section"><h1>Administración de tienda</h1><p id="message" role="status">Validando permisos...</p><div id="panel" hidden><form id="productForm" class="panel-form"><h2>Productos e inventario</h2><label>Nombre<input id="name" required maxlength="120"></label><label>Categoría<select id="category" required><option value="Hombre">Hombre</option><option value="Mujer">Mujer</option><option value="Accesorios">Accesorios</option></select></label><label>Marca<input id="brand" placeholder="Ej. Tommy Hilfiger" maxlength="100"></label><label>Tallas disponibles (separadas por coma)<input id="sizes" placeholder="S, M, L, XL"></label><label>Descripción<textarea id="description"></textarea></label><label>URL HTTPS de imagen<input id="image_url" type="url" placeholder="https://..."></label><label>Precio en S/<input id="price" type="number" min="0" step="0.01" required></label><label>Unidades en stock<input id="stock" type="number" min="0" step="1" required></label><label class="check"><input type="checkbox" id="active" checked> Producto publicado</label><div class="actions"><button id="save" class="button dark" type="submit">Crear producto</button><button id="reset" class="button outline" type="button">Limpiar</button></div></form><h2>Catálogo</h2><div class="table-scroll"><table><thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="productRows"></tbody></table></div><h2>Pedidos recientes</h2><p>Los pagos se verifican manualmente fuera de la web.</p><div class="table-scroll"><table><thead><tr><th>Pedido</th><th>Fecha</th><th>Total</th><th>Medio</th><th>Pago</th><th>Entrega</th><th>Acción</th></tr></thead><tbody id="orders"></tbody></table></div></div></main><script src="./store-config.js?v=20261029-2"></script><script type="module" src="./admin.js?v=20261029-2"></script></body></html>
